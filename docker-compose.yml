# docker compose up --build      UI: http://localhost:8501   API docs: http://localhost:8765/docs
# Prerequisite on the host: Ollama running with `ollama pull qwen2.5:3b`.
services:
  api:
    build: .
    image: receipt-intelligence:latest   # built once here, reused by ui
    ports: ["8765:8765"]
    volumes:
      - ./data:/app/data       # SQLite DB + uploaded originals survive rebuilds
      - ./models:/app/models   # PaddleOCR models: downloaded once, not baked into the image
    extra_hosts:
      - "host.docker.internal:host-gateway"   # automatic on Docker Desktop; needed on plain Linux
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    image: receipt-intelligence:latest   # reuse the api image: two parallel ~1 GB pip installs strain an 8 GB Docker VM
    pull_policy: never                  # local image, never on a registry
    command: ["streamlit", "run", "src/receipt_ai/ui.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8765   # service name on the compose network, not localhost
    depends_on:
      api:
        condition: service_healthy
